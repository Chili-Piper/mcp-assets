        \ round-robin fallback when no owner matches.\n\n- slug: URL slug (lowercase letters, digits,\
        \ hyphens, underscores).\n\n- ownership: owner-routing config, {ownershipSettings, host, bookerInvitation,\
        \ alwaysInvitedUsers}.\n\n- distribution: round-robin fallback config, {assignments: [{distributionId,\
        \ required}], host, bookerInvitation, alwaysInvitedUsers}.\n\n- pageConfig (opt): {title?}. sharedWith\
        \ (opt): {type: \"Workspace\"} (default) or {type: \"Teams\", teamIds}.\n\n  Note: the ownership/distribution\
        \ shapes mirror the scheduling-link-list-ownership response, except assignments here are lean\
        \ {distributionId, required} — do not send the read-side members field (members are resolved from\
        \ the distribution by the backend).\n\n→\n\n    {workspaceId, linkId, name, slug, meetingTypeIds,\
        \ ownership, distribution, pageConfig, sharedWith, bookingUrl}\n\nsee: scheduling-link-list-ownership\
        \ (browse existing for the exact ownership/distribution shape), distribution-list (find distributionIds)"
