        \ {CP.*} merge tags. `sharedWith` is {type: \"Workspace\"} or {type: \"Teams\", teamIds}; supplying\
        \ it provisions the admin (one-on-one) scheduling link that carries the scope — omit it and sharing\
        \ can only be set later by managing that link directly.\n\n  Note: creation is NOT atomic — if\
        \ a follow-up call fails the meeting type exists without those fields, and re-creating duplicates\
        \ it; fix with meeting-type-update instead.\n\n- location (opt): {default: <Location>, others:\
        \ [<Location>]}; omit to keep the workspace default. Each <Location> is one of:\n\n    {type:\
        \ \"ZoomOneTimeLink\"|\"TeamsMeetingLink\"|\"GongLink\"|\"GoToMeetingLink\"|\"RingCentralLink\"\
        |\"WebexLink\"|\"HostsDefaultConferenceDetails\"|\"HostsDefaultPhysicalLocation\", index, host:\
