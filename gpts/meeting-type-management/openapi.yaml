      summary: Create meeting type
      description: "[operation: meeting-type-create]\n\n\n\nMUTATING\n\n\n\nCreates a new team meeting\
        \ type from a minimal payload; the backend fills in product defaults.\n\n- workspaceId (req):\
        \ the workspace to create the meeting type in\n\n- name (req): display name (internal — identifies\
        \ the meeting type, e.g. in the meeting-type list)\n\n- duration (req): meeting length, e.g. \"\
        30 minutes\"\n\n- description (opt): the meeting type's INTERNAL description — NOT shown to guests\
        \ on the calendar invite. To set what the guest sees, use inviteDescription. Applied via a follow-up\
        \ update (see note).\n\n- inviteTitle (opt): the calendar invite's subject line shown to guests.\
        \ Supports {CP.*} merge tags (e.g. \"{CP.Host.FullName}\"). Defaults to the name when omitted.\
        \ Applied via a follow-up update (see note).\n\n- inviteDescription (opt): the calendar invite's\
        \ body shown to guests (the \"Meeting Invite → Description\" field in the UI). Supports {CP.*}\
        \ merge tags (e.g. \"{CP.DataField.FirstName}\", \"{CP.Meeting.Location}\"). Applied via a follow-up\
        \ update (see note).\n\n- location (opt): conferencing/location config — {default: <Location>,\
        \ others: [<Location>]}; omit to keep the workspace default. Each <Location> is one of:\n\n  \
        \  {type: \"ZoomOneTimeLink\"|\"TeamsMeetingLink\"|\"GongLink\"|\"GoToMeetingLink\"|\"RingCentralLink\"\
        |\"WebexLink\"|\"HostsDefaultConferenceDetails\"|\"HostsDefaultPhysicalLocation\", index, host:\
        \ \"Host\"|\"AssigneeIfExists\"|\"BookerIfExists\"}\n    {type: \"CalendarPlatformConference\"\
        , index}\n    {type: \"AskTheGuest\", index}\n    {type: \"DefinedInMeetingType\", index, value?}\n\
        \n- sharedWith (opt): sharing scope — {type: \"Workspace\"} (whole workspace) or {type: \"Teams\"\
        , teamIds: [...]}. When supplied, Edge also provisions the meeting type's admin (one-on-one) scheduling\
        \ link to carry it (see note); omit to create no admin link (sharing can then only be set by managing\
        \ that link directly).\n\n  Note: the create endpoint only accepts name, duration and the default\
        \ location; the description, inviteTitle, inviteDescription, any location alternatives (others),\
        \ and (when sharedWith is supplied) the admin scheduling link that carries the sharing scope are\
        \ applied immediately afterwards via FURTHER calls. This is NOT atomic — if a follow-up call fails\
        \ the meeting type exists without them, and retrying creates a duplicate. Re-run meeting-type-update\
        \ to set them rather than re-creating.\n\n→\n\n    {id, workspaceId, name, description?, inviteTitle,\
        \ inviteDescription, status, duration, location: {default: {type, index, host?, value?}, others:\
        \ [{type, index, host?, value?}]}, buffers: {before?, after?}, meetingLimit?: {limitBy: \"Email\"\
        |\"Domain\", timeframe: \"Hourly\"|\"Daily\"|\"Weekly\"|\"Monthly\"|\"Yearly\", count}, sharedWith?:\
        \ {type: \"Workspace\"}|{type: \"Teams\", teamIds}, reminders: [{id, workspaceId, channel, trigger:\
        \ {kind, offset?}, name, title?, body}]}\n\nsee: meeting-type-list (find a workspaceId), meeting-type-update\
        \ (edit afterwards)"
