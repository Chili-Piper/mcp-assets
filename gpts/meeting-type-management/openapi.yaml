      description: "[operation: meeting-type-reminder-list]\n\n\n\nREAD-ONLY\n\n\n\nReturns reminders\
        \ (Email or Sms) defined in the tenant's workspaces. Reminders are workspace-scoped entities that\
        \ meeting types reference.\n\n- workspaceId (opt): list only reminders in this workspace; omit\
        \ to fan out across all of the tenant's workspaces\n\n→\n\n    [{id, workspaceId, channel: \"\
        Email\"|\"Sms\", trigger: {kind: \"BeforeMeeting\"|\"BeforeMeetingNoResponse\"|\"MeetingBooked\"\
        |\"AfterMeeting\", offset?}, name, title?, body}]\n\n  Note: reminders are lean here — advanced\
        \ send-restrictions and email/sms behaviours are managed by the backend and not exposed.\n\nsee:\
        \ meeting-type-reminder-create (add one), meeting-type-reminder-update (edit one), meeting-type-reminder-delete\
        \ (remove one)"
      operationId: meetingTypeReminderList
      parameters:
      - name: workspaceId
        in: query
        description: Filter reminders by workspace ID. Omit to list across all of the tenant's workspaces.
        required: false
        schema:
          type: string
          pattern: '[^\s\\/]+'
      responses:
        '200':
          description: ''
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
            X-Robots-Tag:
              required: true
              schema:
                type: string
            Pragma:
              required: true
              schema:
                type: string
            Expires:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reminder'
        '400':
          description: 'Invalid value for: query parameter workspaceId'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          headers:
            Location:
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - errorCode
                - errorMessage
                properties:
                  errorCode:
                    type: string
                  errorMessage:
                    type: string
                  arguments:
                    $ref: '#/components/schemas/Map_String'
      security:
      - apiKeyAuth: []
      X-Chili-Required-Permissions:
      - meeting-type.read
  /v1/org/meeting-type-reminders:
    post:
      tags:
      - meeting-type-reminder
      summary: Create meeting type reminder
      description: "[operation: meeting-type-reminder-create]\n\n\n\nMUTATING\n\n\n\nCreates a new reminder\
        \ in a team workspace; the backend fills in product defaults for advanced behaviours.\n\n- workspaceId\
        \ (req): the workspace to create the reminder in\n\n- channel (req): \"Email\" or \"Sms\"\n\n\
        - trigger (req): {kind, offset?} — when the reminder fires; offset (e.g. \"1 hour\") is required\
        \ for \"BeforeMeeting\", \"BeforeMeetingNoResponse\" and \"AfterMeeting\", and must be omitted\
        \ for \"MeetingBooked\"\n\n- name (req): internal name\n\n- title (opt): email subject line (Email\
        \ only; ignored for Sms)\n\n- body (req): reminder message body\n\n→\n\n    {id, workspaceId,\
        \ channel: \"Email\"|\"Sms\", trigger: {kind, offset?}, name, title?, body}\n\n  Note: reminders\
        \ are lean — advanced send-restrictions and email/sms behaviours are backend-defaulted and not\
        \ settable here.\n\nsee: meeting-type-reminder-list (find a workspaceId), meeting-type-reminder-update\
        \ (edit afterwards)"
      operationId: meetingTypeReminderCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderCreate'
        required: true
      responses:
        '200':
          description: ''
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
            X-Robots-Tag:
              required: true
              schema:
                type: string
            Pragma:
              required: true
              schema:
                type: string
            Expires:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
        '400':
          description: 'Invalid value for: body'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          headers:
            Location:
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - errorCode
                - errorMessage
                properties:
                  errorCode:
                    type: string
                  errorMessage:
                    type: string
                  arguments:
                    $ref: '#/components/schemas/Map_String'
      security:
      - apiKeyAuth: []
      X-Chili-Required-Permissions:
      - meeting-type.create
  /v1/org/meeting-type-reminders/{reminderId}:
    put:
      tags:
      - meeting-type-reminder
      summary: Update meeting type reminder
      description: "[operation: meeting-type-reminder-update]\n\n\n\nMUTATING — IDEMPOTENT\n\n\n\nPatches\
        \ a reminder. Only the fields you supply are changed; omitted fields keep their current value.\
        \ The channel cannot be changed.\n\n- reminderId (req): the reminder's id\n\n- workspaceId (req):\
        \ the workspace the reminder belongs to\n\n- name (opt): new internal name\n\n- trigger (opt):\
        \ {kind, offset?} — new firing condition (offset required for timed kinds, omitted for \"MeetingBooked\"\
        )\n\n- title (opt): new email subject line (Email only)\n\n- body (opt): new message body\n\n\
        →\n\n    {id, workspaceId, channel: \"Email\"|\"Sms\", trigger: {kind, offset?}, name, title?,\
        \ body}\n\n  Note: advanced send-restrictions and email/sms behaviours are preserved unchanged.\n\
        \n⚠ takes effect immediately\n\nsee: meeting-type-reminder-list (find the reminderId and workspaceId\
        \ before editing)"
      operationId: meetingTypeReminderUpdate
      parameters:
      - name: reminderId
        in: path
        required: true
        schema:
          type: string
          pattern: '[^\s\\/]+'
      - name: workspaceId
        in: query
        description: The workspace the reminder belongs to.
        required: true
        schema:
          type: string
          pattern: '[^\s\\/]+'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderUpdate'
        required: true
      responses:
        '200':
          description: ''
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
            X-Robots-Tag:
              required: true
              schema:
                type: string
            Pragma:
              required: true
              schema:
                type: string
            Expires:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
        '400':
          description: 'Invalid value for: path parameter reminderId, Invalid value for: query parameter
            workspaceId, Invalid value for: body'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          headers:
            Location:
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - errorCode
                - errorMessage
                properties:
                  errorCode:
                    type: string
                  errorMessage:
                    type: string
                  arguments:
                    $ref: '#/components/schemas/Map_String'
      security:
      - apiKeyAuth: []
      X-Chili-Required-Permissions:
      - meeting-type.modify
    delete:
      tags:
      - meeting-type-reminder
      summary: Remove meeting type reminder
      description: "[operation: meeting-type-reminder-delete]\n\n\n\nMUTATING — DESTRUCTIVE\n\n\n\nDeletes\
        \ a reminder by id.\n\n- reminderId (req): the reminder's id\n\n- workspaceId (req): the workspace\
        \ the reminder belongs to\n\n→\n\n    {}\n\n  Note: an unknown reminder id (or one in another\
        \ workspace) returns a typed 404, not a silent success — the id is verified in the workspace before\
        \ deletion.\n\n⚠ irreversible via API; any meeting types referencing this reminder stop sending\
        \ it\n\nsee: meeting-type-reminder-list (confirm the reminderId and workspaceId before deleting)"
      operationId: meetingTypeReminderDelete
      parameters:
      - name: reminderId
        in: path
        required: true
        schema:
          type: string
          pattern: '[^\s\\/]+'
      - name: workspaceId
        in: query
        description: The workspace the reminder belongs to.
        required: true
        schema:
          type: string
          pattern: '[^\s\\/]+'
      responses:
        '200':
          description: ''
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
            X-Robots-Tag:
              required: true
              schema:
                type: string
            Pragma:
              required: true
              schema:
                type: string
            Expires:
              required: true
              schema:
                type: string
        '400':
          description: 'Invalid value for: path parameter reminderId, Invalid value for: query parameter
            workspaceId'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          headers:
            Location:
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - errorCode
                - errorMessage
                properties:
                  errorCode:
                    type: string
                  errorMessage:
                    type: string
                  arguments:
                    $ref: '#/components/schemas/Map_String'
      security:
      - apiKeyAuth: []
      X-Chili-Required-Permissions:
      - meeting-type.remove
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      description: 'API key in Authorization header. Format: ''Authorization: Bearer <api-key>'' — the
        word ''Bearer'' followed by a space and the key is required. Sending the key without the Bearer
        prefix returns 401.'
      name: Authorization
      in: header
  schemas:
    MeetingTypeStatus:
      title: MeetingTypeStatus
      type: string
      enum:
      - Active
      - Inactive
    SimpleMetadata:
      title: SimpleMetadata
      type: object
      required:
      - createdAt
      - createdBy
      - updatedAt
      - updatedBy
      - revision
      properties:
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/CallerRef'
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: '#/components/schemas/CallerRef'
        revision:
          type: integer
          format: int32
    TeamsMeetingLink:
      title: TeamsMeetingLink
      type: object
      required:
      - index
      - host
      - type
      properties:
        index:
          type: integer
          format: int32
        host:
          $ref: '#/components/schemas/MeetingLocationHost'
        type:
          type: string
          const: TeamsMeetingLink
    HostsDefaultPhysicalLocation:
      title: HostsDefaultPhysicalLocation
      type: object
      required:
      - index
      - host
      - type
      properties:
        index:
          type: integer
          format: int32
        host:
          $ref: '#/components/schemas/MeetingLocationHost'
        type:
          type: string
          const: HostsDefaultPhysicalLocation
    WorkspaceId:
      title: WorkspaceId
      examples:
      - b7263a5d-89cb-4f50-a532-ea4aff74688e
      type: string
      pattern: '[^\s\\/]+'
    MeetingLocation:
      title: MeetingLocation
      oneOf:
      - $ref: '#/components/schemas/AskTheGuest'
      - $ref: '#/components/schemas/CalendarPlatformConference'
      - $ref: '#/components/schemas/DefinedInMeetingType'
      - $ref: '#/components/schemas/GoToMeetingLink'
      - $ref: '#/components/schemas/GongLink'
      - $ref: '#/components/schemas/HostsDefaultConferenceDetails'
      - $ref: '#/components/schemas/HostsDefaultPhysicalLocation'
      - $ref: '#/components/schemas/RingCentralLink'
      - $ref: '#/components/schemas/TeamsMeetingLink'
      - $ref: '#/components/schemas/WebexLink'
      - $ref: '#/components/schemas/ZoomOneTimeLink'
      discriminator:
        propertyName: type
        mapping:
          AskTheGuest: '#/components/schemas/AskTheGuest'
          CalendarPlatformConference: '#/components/schemas/CalendarPlatformConference'
          DefinedInMeetingType: '#/components/schemas/DefinedInMeetingType'
          GoToMeetingLink: '#/components/schemas/GoToMeetingLink'
          GongLink: '#/components/schemas/GongLink'
          HostsDefaultConferenceDetails: '#/components/schemas/HostsDefaultConferenceDetails'
          HostsDefaultPhysicalLocation: '#/components/schemas/HostsDefaultPhysicalLocation'
          RingCentralLink: '#/components/schemas/RingCentralLink'
          TeamsMeetingLink: '#/components/schemas/TeamsMeetingLink'
          WebexLink: '#/components/schemas/WebexLink'
          ZoomOneTimeLink: '#/components/schemas/ZoomOneTimeLink'
    CalendarPlatformConference:
      title: CalendarPlatformConference
      type: object
      required:
      - index
      - type
      properties:
        index:
          type: integer
          format: int32
        type:
          type: string
          const: CalendarPlatformConference
    MeetingBookingLimit:
      title: MeetingBookingLimit
