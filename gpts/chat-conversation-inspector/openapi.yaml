  /v1/org/chat/logs:
    get:
      tags:
      - chat
      summary: Reads Chat Conversation Logs
      description: "[operation: chat-logs]\n\n\n\nREAD-ONLY\n\n\n\nReads a workspace's Chat AI conversation\
        \ logs over a time window — the read-only audit trail of who chatted, how they were routed, and\
        \ what got booked. Each entry carries the full bot/guest transcript, the routing outcome, and\
        \ any meetings booked. Use it to inspect or debug live chat routing after the fact. The start/end\
        \ window (ISO-8601) spans at most 30 days. Pass playbookId (repeatable) to restrict to specific\
        \ chat playbooks. Narrow to a specific guest or rule with guestEmail (case-insensitive exact match),\
        \ guestId (exact match), ruleId (exact match on any routing rule executed in the session; stable\
        \ across rule renames), and/or ruleName (exact match on any routing rule executed in the session).\
        \ Pages start at 0; pageSize defaults to 10, max 50.\n\n→\n\n    {results: [{guestId, sessionId,\
        \ playbookId, guestEmail, startedAt, endedAt, ended, targetedUrl, respondedUrl, routingOutcome,\
        \ ruleId, ruleName, conversationAssigneeId, routedAt, repJoined, chatAiStarted, meetingBooked,\
        \ meetings: [{assigneeId, origin, scheduledAt}], messages: [{role, content, timestamp}]}], total,\
        \ page, pageSize}\n\n  Note: routingOutcome is one of Routed | NotRouted | Abandoned; role is\
        \ one of Bot | Guest; meetings[N].origin is one of Journey | Inbox | NoMeeting\n\nsee: workspace-list\
        \ (find workspaceId)"
      operationId: chatLogs
      parameters:
      - name: workspaceId
        in: query
        description: Id of the workspace
        required: true
        schema:
          type: string
          pattern: '[^\s\\/]+'
      - name: start
        in: query
        description: time of start such as 2025-01-08T13:46:18.681Z (ISO8601 format)
        required: true
        schema:
          type: string
          format: date-time
      - name: end
        in: query
        description: time of end such as 2025-01-14T13:46:18.681Z (ISO8601 format)
        required: true
        schema:
          type: string
          format: date-time
      - name: playbookId
        in: query
        description: Optional chat playbook id(s) to restrict the logs to; repeatable. When omitted, all
          playbooks in the workspace are considered.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: guestEmail
        in: query
        description: Optional guest email to filter logs by (case-insensitive exact match). When omitted,
          all guests are considered.
        required: false
        schema:
          type: string
          pattern: .+@.+
      - name: guestId
        in: query
        description: Optional guest id to filter logs by (exact match). When omitted, all guests are considered.
        required: false
        schema:
          type: string
          format: uuid
      - name: ruleId
        in: query
        description: Optional routing-rule id to filter logs by (exact match on any rule executed in the
          session). Stable across rule renames. When omitted, all rules are considered.
        required: false
        schema:
          type: string
          pattern: '[^\s\\/]+'
      - name: ruleName
        in: query
        description: Optional routing-rule name to filter logs by (exact match on any rule executed in
          the session). When omitted, all rules are considered.
        required: false
        schema:
          type: string
