        \ outcome}], catchAll: outcome}\n\n  outcome:\n\n    {type: \"Schedule\", assignment, meetingTypeId,\
        \ crmActions?}\n\n  Schedule assigns the lead and books a meeting type. assignment is {type: \"\
        Distribution\", distributionId} (round-robin / ownership / whatever the distribution does) or\
        \ {type: \"User\", userId} (a specific host). crmActions (opt) is an ordered post-booking chain,\
        \ each {type: \"ConvertLead\"}. ruleId is required on every row; an always-match route is the\
        \ catchAll. routes may be empty (then only the catchAll applies).\n\n  Note: handoff routers support\
        \ only Schedule outcomes — no Redirect, no no-show timeout, and ConvertLead is the only CRM action\
