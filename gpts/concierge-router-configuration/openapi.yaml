        \ required, hidden?}], readOnlyTriggers: [string]}\n    inAppButton: {fields: [{dataField}]}\n\
        \    routerLink: {fields: [{dataField, label, required, hidden?}]}\n    branding: {coverImage?,\
        \ headingText?, language?}\n    localizations: {\"<lang-tag>\": {\"<key>\": \"<text>\"}}\n\n \
        \ Note: the routing summary is lossy by design — it NAMES each row's outcome (including ones Edge\
        \ can't itself produce, e.g. Redirect/CrmAction) so you can see what the router does even when\
        \ it was built in the app\n\n  Note: routing.representable is true only when the current routing\
        \ — both the draft tree and the published tree — is exactly what Edge's create/update would have\
        \ produced; when false, an update with a new routing may be rejected (edit it in the Concierge\
        \ app instead). A router that has no routing tree yet also reports representable=false, but an\
        \ update setting routing on it is still accepted (nothing is destroyed).\n\n  Note: form.representable\
        \ is true only when the router's webform is a Chili form (or absent) — only then is a form update\
        \ accepted. form.fields lists the editable Chili-form fields; form.readOnlyTriggers names trigger\
        \ kinds Edge doesn't edit here (only ThirdPartyForm — a third-party webform). inAppButton/routerLink\
        \ (when present) are the router's in-app-button / router-link triggers and ARE editable via concierge-router-update.\
        \ branding/localizations are absent when unset.\n\nsee: concierge-list-routers (browse to find\
        \ a routerId), concierge-router-update (replace routing/form/branding/localizations)"
      operationId: conciergeRouterGet
      parameters:
