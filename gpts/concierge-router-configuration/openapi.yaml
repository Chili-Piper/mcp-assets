  /v1/org/concierge/routers/concierge:
    post:
      tags:
      - concierge
      summary: Create concierge router
      description: "[operation: concierge-router-create]\n\n\n\nMUTATING\n\n\n\nCreates a Concierge router\
        \ and publishes it live in one step — there is no unpublished-draft state via the API. workspaceId\
        \ must be a team workspace of this tenant (400 otherwise). The URL slug is derived from name on\
        \ publish (there is no separate slug field). Triggers are a PRODUCT of optional kinds — set any\
        \ combination of form (the Chili webform), inAppButton, and routerLink; supplying NONE auto-generates\
        \ a minimal email-only Chili webform. A routerLink is what gives the router a shareable Router\
        \ Link URL. branding and localizations are optional.\n\n- routing (req): ordered rules evaluated\
        \ top-down, plus a mandatory catch-all fallback. Each row's rule, when it matches, runs that row's\
        \ `outcome`; the catch-all `outcome` runs when no row matches:\n\n    {routes: [{ruleId, outcome}],\
        \ catchAll: outcome}\n\n  outcome (one of):\n\n    {type: \"Schedule\", assignment, meetingTypeId,\
        \ timeout?, crmActions?}\n    {type: \"Redirect\", url}\n\n  Schedule assigns the lead and books\
        \ a meeting type. assignment is {type: \"Distribution\", distributionId} (round-robin / ownership\
        \ / whatever the distribution does) or {type: \"User\", userId} (a specific host). timeout (opt)\
        \ {minutes, onTimeout} sets the no-show fallback; onTimeout is {type: \"Landing\"} or {type: \"\
        Url\", url}; omit timeout for the default (10 min → Landing). crmActions (opt) is an ordered post-booking\
        \ chain, each {type: \"ConvertLead\"} or {type: \"Notify\", slackChannel?} (omit slackChannel\
        \ to notify the assigned host instead of a named channel). Redirect sends the lead to a URL instead\
        \ of booking. ruleId is required on every row; an always-match route is the catchAll. routes may\
        \ be empty (then only the catchAll applies).\n\n- form (opt): the Chili-hosted guest form fields\
        \ the lead fills in; MUST include the email field (PersonEmail) or the create is rejected. Omit\
        \ for a default email-only form:\n\n    [{dataField, label, description?, required?, hidden?}]\n\
        \n  Note: dataField is a CRM data-field reference — a default field name (e.g. PersonEmail, PersonFirstName)\
        \ or a custom-field UUID; a made-up name is rejected (400). label is the field's display name;\
        \ required toggles whether the guest must fill it. hidden (opt) is a PREFILLED value (a string)\
        \ stored on the field but NOT shown to the guest — it is a value, not a show/hide flag; omit it\
        \ for a normal visible field.\n\n- inAppButton (opt): an in-app-button trigger — the data fields\
        \ the button collects; MUST include the email field (PersonEmail):\n\n    [{dataField}]\n\n- routerLink\
        \ (opt): a router-link trigger — gives the router a shareable Router Link URL; the fields its\
        \ form collects; MUST include the email field (PersonEmail):\n\n    [{dataField, label, required?,\
        \ hidden?}]\n\n  Note: dataField/label/required/hidden are as for form. A router-link field's\
        \ enrichment waterfall is not settable via the API (preserved if already configured in the Concierge\
        \ app).\n\n- branding (opt): the booking page's cover/heading/language — {coverImage?, headingText?,\
        \ language?}\n\n- localizations (opt): per-language text overrides — {\"<lang-tag>\": {\"<key>\"\
        : \"<text>\"}}\n\n→\n\n    {id, workspaceId, name?, slug?, routing: {known, representable, rows:\
        \ [{ruleId?, ruleType?, outcome}], catchAll?: {outcome}}, form?, inAppButton?, routerLink?, branding?,\
        \ localizations?}\n\n  Note: the returned routing is the lossy per-row summary (same shape as\
        \ concierge-router-get), not the matrix you sent; form/inAppButton/routerLink/branding/localizations\
        \ echo the created config (same shape as concierge-router-get)\n\n⚠ if the final publish step\
        \ fails the router is left behind as an UNPUBLISHED draft (typed 422); retrying the create mints\
        \ ANOTHER draft — fix or delete the leftover in the Concierge app\n\nsee: concierge-list-routers\
        \ (find a workspaceId), rule-list (find ruleIds), distribution-list (find distributionIds), user-find\
        \ (find userIds), meeting-type-list (find meetingTypeIds), concierge-router-update (replace config\
        \ afterwards)"
      operationId: conciergeRouterCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConciergeRouterCreate'
        required: true
      responses:
        '200':
          description: ''
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
            X-Robots-Tag:
              required: true
              schema:
                type: string
            Pragma:
              required: true
              schema:
                type: string
            Expires:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConciergeRouter'
        '400':
          description: 'Invalid value for: body'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
