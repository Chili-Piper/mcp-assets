  /v1/org/enrichment/waterfall:
    get:
      tags:
      - enrichment
      summary: List enrichment waterfalls
      description: 'READ-ONLY. List enrichment waterfalls. List a workspace''s enrichment waterfalls and
        their ordered provider fields. Params: workspaceId (required), page, pageSize.'
      operationId: enrichmentWaterfallList
      parameters:
      - name: workspaceId
        in: query
        description: Workspace whose enrichment waterfalls to list.
        required: true
        schema:
          type: string
          pattern: '[^\s\\/]+'
      - name: page
        in: query
        description: Page number. First page has index 0.
        required: false
        schema:
          default: 0
          type: integer
          format: int64
          minimum: 0
      - name: pageSize
        in: query
        description: Number of items per page.
        required: false
        schema:
          default: 200
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        '200':
          description: ''
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
            X-Robots-Tag:
              required: true
              schema:
                type: string
            Pragma:
              required: true
              schema:
                type: string
            Expires:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResult_EnrichmentWaterfall'
        '400':
          description: 'Invalid value for: query parameter workspaceId, Invalid value for: query parameter
            page, Invalid value for: query parameter pageSize'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          headers:
            Location:
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - errorCode
                - errorMessage
                properties:
                  errorCode:
                    type: string
                  errorMessage:
                    type: string
                  arguments:
                    $ref: '#/components/schemas/Map_String'
      security:
      - apiKeyAuth: []
      X-Chili-Required-Permissions:
      - data-field.read
      x-mcp-tool: enrichment-waterfall-list
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      description: 'API key in Authorization header. Format: ''Authorization: Bearer <api-key>'' — the
        word ''Bearer'' followed by a space and the key is required. Sending the key without the Bearer
        prefix returns 401.'
      name: Authorization
      in: header
  schemas:
    EngagementOwner:
      title: EngagementOwner
      oneOf:
      - $ref: '#/components/schemas/EngagementOwner_Assignee'
      - $ref: '#/components/schemas/EngagementOwner_Booker'
      discriminator:
        propertyName: type
        mapping:
          Assignee: '#/components/schemas/EngagementOwner_Assignee'
          Booker: '#/components/schemas/EngagementOwner_Booker'
    HubspotNoMatchBehaviour_DoNothing:
      title: HubspotNoMatchBehaviour_DoNothing
      type: object
      required:
      - type
      properties:
        type:
          type: string
          const: DoNothing
    SingleOperator:
      title: SingleOperator
      type: string
      enum:
      - notEmpty
      - empty
    ConciergeRouterCreate:
      title: ConciergeRouterCreate
      type: object
      required:
      - workspaceId
      - name
      - routing
      properties:
        workspaceId:
          $ref: '#/components/schemas/WorkspaceId'
        name:
          description: Customer-facing router name; the slug is derived from it on publish.
          type: string
        routing:
          $ref: '#/components/schemas/RouterRouting'
        form:
          description: Chili webform guest fields; the mapping must include the email field (PersonEmail).
          type: array
          items:
            $ref: '#/components/schemas/RouterFormField'
        thirdPartyForm:
          description: Third-party (external) webform field mappings (externalFieldName to dataField);
            must include PersonEmail. Mutually exclusive with form.
          type: array
          items:
            $ref: '#/components/schemas/RouterThirdPartyFormField'
        inAppButton:
          description: In-app-button trigger field mappings; the mapping must include the email field
            (PersonEmail).
          type: array
          items:
            $ref: '#/components/schemas/RouterInAppButtonField'
        routerLink:
          description: Router-link trigger field mappings (yields a shareable Router Link URL); must include
            the email field (PersonEmail).
          type: array
          items:
            $ref: '#/components/schemas/RouterLinkField'
        branding:
          $ref: '#/components/schemas/RouterBranding'
          description: Cover image, heading and language for the routing page.
        localizations:
          $ref: '#/components/schemas/Map_Locale_Map_String_String'
          description: Per-language string overrides for the routing page.
        routingSteps:
          description: Ordered pre-routing steps (enrichment, spam-check) run before the routes.
          type: array
          items:
            $ref: '#/components/schemas/ConciergeRoutingStep'
