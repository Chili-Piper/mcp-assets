  /v1/org/concierge/routers/concierge:
    post:
      tags:
      - concierge
      summary: Create concierge router
      description: "[operation: concierge-router-create]\n\n\n\nMUTATING\n\n\n\nCreates a Concierge router\
        \ with a name and a simplified routing matrix, and PUBLISHES it — the router is live (functional)\
        \ immediately; there is no unpublished-draft step. The guest form, branding, and localizations\
        \ are optional; when the form is omitted a minimal valid Chili form (a single email field) is\
        \ generated automatically.\n\n- workspaceId (req): the workspace to create the router in; must\
        \ be a team workspace of this tenant (400 otherwise)\n\n- name (req): display name (the URL slug\
        \ is derived from it on publish — there is no separate slug field)\n\n- routing (req): the routing\
        \ matrix — ordered rules evaluated top-down, plus a mandatory catch-all fallback. Each row's rule,\
        \ when it matches, runs that row's `outcome`; the catch-all `outcome` runs when no row matches:\n\
        \n    {routes: [{ruleId, outcome}], catchAll: outcome}\n\n  outcome (one of):\n\n    {type: \"\
        Schedule\", assignment, meetingTypeId, timeout?, crmActions?}\n    {type: \"Redirect\", url}\n\
        \n  Schedule assigns the lead and books a meeting type. assignment is {type: \"Distribution\"\
        , distributionId} (round-robin / ownership / whatever the distribution does) or {type: \"User\"\
        , userId} (a specific host). timeout (opt) {minutes, onTimeout} sets the no-show fallback; onTimeout\
        \ is {type: \"Landing\"} or {type: \"Url\", url}; omit timeout for the default (10 min → Landing).\
        \ crmActions (opt) is an ordered post-booking chain, each {type: \"ConvertLead\"} or {type: \"\
        Notify\", slackChannel?} (omit slackChannel to notify the assigned host instead of a named channel).\
        \ Redirect sends the lead to a URL instead of booking. ruleId is required on every row; an always-match\
        \ route is the catchAll. routes may be empty (then only the catchAll applies).\n\n- form (opt):\
        \ the Chili-hosted guest form fields the lead fills in; MUST include the email field (PersonEmail)\
        \ or the create is rejected. Omit for a default email-only form:\n\n    [{dataField, label, description?,\
        \ required?, hidden?}]\n\n  Note: dataField is a CRM data-field reference — a default field name\
        \ (e.g. PersonEmail, PersonFirstName) or a custom-field UUID; a made-up name is rejected (400).\
        \ label is the field's display name; required toggles whether the guest must fill it. hidden (opt)\
        \ is a PREFILLED value (a string) stored on the field but NOT shown to the guest — it is a value,\
        \ not a show/hide flag; omit it for a normal visible field.\n\n- branding (opt): the booking page's\
        \ cover/heading/language — {coverImage?, headingText?, language?}\n\n- localizations (opt): per-language\
        \ text overrides — {\"<lang-tag>\": {\"<key>\": \"<text>\"}}\n\n→\n\n    {id, workspaceId, name?,\
        \ slug?, routing: {known, representable, rows: [{ruleId?, ruleType?, outcome}], catchAll?: {outcome}},\
        \ form?, branding?, localizations?}\n\n  Note: the returned routing is the lossy per-row summary\
        \ (same shape as concierge-router-get), not the matrix you sent; form/branding/localizations echo\
        \ the created config (same shape as concierge-router-get)\n\n⚠ if the final publish step fails,\
        \ the router is left behind as an UNPUBLISHED draft and a typed 422 error is returned — retrying\
        \ the create mints ANOTHER draft; fix or delete the leftover draft in the Concierge app\n\nsee:\
        \ concierge-list-routers (find a workspaceId), rule-list (find ruleIds), distribution-list (find\
        \ distributionIds), user-find (find userIds), meeting-type-list (find meetingTypeIds), concierge-router-update\
        \ (replace config afterwards)"
      operationId: conciergeRouterCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConciergeRouterCreate'
        required: true
      responses:
        '200':
          description: ''
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
            X-Robots-Tag:
              required: true
              schema:
                type: string
            Pragma:
              required: true
              schema:
                type: string
            Expires:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConciergeRouter'
        '400':
          description: 'Invalid value for: body'
          content:
            text/plain:
              schema:
                type: string
        default:
