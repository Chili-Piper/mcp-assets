      summary: Update concierge router
      description: "[operation: concierge-router-update]\n\n\n\nMUTATING — IDEMPOTENT\n\n\n\nEdits a Concierge\
        \ router and republishes it live. Only the fields you supply change; omitted fields (and config\
        \ dimensions Edge doesn't model, e.g. third-party webforms, router-link enrichment waterfalls,\
        \ and CRM-upsert settings) are preserved. Supplying name re-derives the URL slug. Each dimension\
        \ you send is a full replace, except branding which merges per sub-field (see below). Triggers\
        \ are a product of optional kinds: form (Chili webform), inAppButton, and routerLink each replace\
        \ only their own kind — writing one never destroys the others. Call concierge-router-get first\
        \ to check routing.representable / form.representable.\n\n- routing (opt): when present, fully\
        \ REPLACES the routing matrix (not a partial merge); when omitted, the current routing is kept.\
        \ Each row's rule, when it matches, runs that row's `outcome`; the catch-all `outcome` runs when\
        \ no row matches:\n\n    {routes: [{ruleId, outcome}], catchAll: outcome}\n\n  outcome (one of):\n\
        \n    {type: \"Schedule\", assignment, meetingTypeId, timeout?, crmActions?}\n    {type: \"Redirect\"\
        , url}\n\n  Schedule assigns the lead and books a meeting type. assignment is {type: \"Distribution\"\
        , distributionId} or {type: \"User\", userId}. timeout (opt) {minutes, onTimeout} sets the no-show\
        \ fallback; onTimeout is {type: \"Landing\"} or {type: \"Url\", url}; omit timeout for the default\
        \ (10 min → Landing). crmActions (opt) is an ordered post-booking chain, each {type: \"ConvertLead\"\
        } or {type: \"Notify\", slackChannel?} (omit slackChannel to notify the assigned host instead\
        \ of a named channel). Redirect sends the lead to a URL instead of booking. ruleId is required\
        \ on every row; an always-match route is the catchAll. routes may be empty (then only the catchAll\
        \ applies).\n\n- form (opt): when present, fully REPLACES the guest form with a Chili form built\
        \ from these fields (the in-app-button / router-link triggers, if any, are preserved); MUST include\
        \ the email field (PersonEmail). Omit to keep the current form:\n\n    [{dataField, label, description?,\
        \ required?, hidden?}]\n\n  Note: dataField is a CRM data-field reference — a default field name\
        \ (e.g. PersonEmail, PersonFirstName) or a custom-field UUID; a made-up name is rejected (400).\
        \ label is the field's display name; required toggles whether the guest must fill it. hidden (opt)\
        \ is a PREFILLED value (a string) stored on the field but NOT shown to the guest — it is a value,\
        \ not a show/hide flag; omit it for a normal visible field.\n\n- inAppButton (opt): when present,\
        \ fully REPLACES the in-app-button trigger's fields (the form/router-link triggers, if any, are\
        \ preserved); MUST include the email field (PersonEmail). Omit to keep the current button:\n\n\
        \    [{dataField}]\n\n- routerLink (opt): when present, fully REPLACES the router-link trigger's\
        \ fields (the form/in-app-button triggers, if any, are preserved); MUST include the email field\
        \ (PersonEmail). Omit to keep the current link:\n\n    [{dataField, label, required?, hidden?}]\n\
        \n  Note: a router-link field's enrichment waterfall is not settable via the API; an existing\
        \ one is preserved (matched by dataField) across the replace.\n\n- branding (opt): the cover/heading/language.\
        \ Merged PER SUB-FIELD: a sub-field you supply is replaced; one you omit is PRESERVED (so a partial\
        \ {headingText} does not wipe coverImage/language). localizations are preserved. To clear a sub-field\
        \ entirely, edit the router in the Concierge app. — {coverImage?, headingText?, language?}\n\n\
        - localizations (opt): when present, fully REPLACES the per-language overrides (preserving branding)\
        \ — {\"<lang-tag>\": {\"<key>\": \"<text>\"}}\n\n→\n\n    {id, workspaceId, name?, slug?, routing:\
        \ {known, representable, rows: [{ruleId?, ruleType?, outcome}], catchAll?: {outcome}}, form?,\
        \ inAppButton?, routerLink?, branding?, localizations?}\n\n  Note: the returned routing is the\
        \ lossy per-row summary (same shape as concierge-router-get), not the matrix you sent\n\n⚠ full-replace\
        \ + publishes live immediately: supplying routing/form/inAppButton/routerLink/localizations replaces\
        \ that ENTIRE dimension, not a partial merge (branding is the exception — it merges per sub-field,\
        \ see above)\n\n⚠ routing REJECTED (409) when the router's existing routing — its DRAFT tree or\
        \ its PUBLISHED tree — isn't representable in this simplified model (advanced routing built in\
        \ the Concierge app — owner-assign, contact-options / multiple-choice, call-rep, multiple assignees\
        \ per row, CRM actions beyond convert-lead / Slack-notify, enrichment or spam-check steps, etc.)\
        \ — to avoid silently destroying it, edit those routers in the Concierge app instead. Check routing.representable\
        \ via concierge-router-get first.\n\n⚠ form REJECTED (409) when the router's current webform is\
        \ a third-party form (not a Chili form) — replacing it would destroy that mapping; check form.representable\
        \ via concierge-router-get first. branding/localizations are always accepted. A name-only update\
        \ always succeeds.\n\n⚠ every update publishes the router's current DRAFT — if the draft carries\
        \ unpublished edits made in the Concierge app, those go live as a side effect, even on a name-only\
        \ patch\n\n⚠ if the final publish step fails, the changes are saved on an UNPUBLISHED draft and\
        \ a typed 422 error is returned — fix or delete the draft in the Concierge app\n\nsee: concierge-router-get\
        \ (check routing.representable / form.representable before replacing), rule-list (find ruleIds),\
        \ distribution-list (find distributionIds), user-find (find userIds), meeting-type-list (find\
        \ meetingTypeIds)"
      operationId: conciergeRouterUpdate
      parameters:
      - name: routerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConciergeRouterUpdate'
        required: true
      responses:
        '200':
          description: ''
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
            X-Robots-Tag:
              required: true
              schema:
                type: string
            Pragma:
              required: true
              schema:
                type: string
            Expires:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
