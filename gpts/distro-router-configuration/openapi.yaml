        \ config stays live; if the router was active and the re-activation fails the new config is published\
        \ but the router is left INACTIVE — a typed 422 error is returned in both cases; fix or activate\
        \ the router in the Distro app\n\nsee: distro-router-get (check routing.representable and status\
        \ before replacing), distro-router-activate / distro-router-deactivate (change activation), rule-list\
        \ (find ruleIds), distribution-list (find distributionIds)"
