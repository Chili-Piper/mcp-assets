  /v1/org/distro/routers:
    post:
      tags:
      - distro
      summary: Create distro router
      description: "[operation: distro-router-create]\n\n\n\nMUTATING\n\n\n\nCreates a Distro router with\
        \ a name and a lead-routing matrix, then PUBLISHES it — but leaves it INACTIVE (not yet routing).\
        \ There is no unpublished-draft step (the publish is implicit), but activation is explicit: call\
        \ distro-router-activate to make the router live. Distro routes CRM records (leads), so routes\
        \ carry NO meeting type and the router needs a trigger.\n\n- workspaceId (req): the workspace\
        \ to create the router in; must be a team workspace of this tenant (400 otherwise)\n\n- name (req):\
        \ display name\n\n- routing (req): the lead-routing matrix — a trigger, ordered rules evaluated\
        \ top-down, a mandatory catch-all, plus optional pre-distribution routing steps. Each route/catch-all\
        \ carries a distribution (who) AND CRM actions (what — at least one is required to publish):\n\
        \n    {trigger: {objectType, eventTypes: [{type, ...}], evaluation?, delay?}, routes: [{ruleId,\
        \ distributionId, actions: [action]}], catchAll: {distributionId, actions: [action]}, routingSteps?:\
        \ [routingStep]}\n    action (one of): {type: \"ReassignRecord\"} | {type: \"UpdateOwnership\"\
        , respectWorkingHours?, sendSlackNotification?, sendEmailNotification?, matchBy?} | {type: \"\
        UpdateField\", field, value?, objectType?} | {type: \"UpdateFieldDynamic\", field, value: dynamicValue,\
        \ objectType?} | {type: \"SendSlackToAssignee\"} | {type: \"SendEmailReminderToAssignee\"}\n \
        \   dynamicValue (one of): {type: \"RelativeDate\", unit: \"Day\"|\"Week\"|\"Month\"|\"Quarter\"\
        |\"Year\", offset?, timeZone?} | {type: \"TemplateText\", text} | {type: \"VariableField\", variableId,\
        \ field, relation?}\n    routingStep (one of): {type: \"Enrichment\", id?, fieldMappings: [{variableId,\
        \ field, waterfallId, overwriteExisting?, relation?}]} | {type: \"SpamCheck\", id?, salesforceWrite:\
        \ {type: \"Off\"} | {type: \"Enabled\", scoreField?, otherFields: [{objectType, field, value?}]}}\n\
        \n  trigger.objectType is the CRM object (Lead, Contact, Account, Opportunity, …); trigger.eventTypes\
        \ is a non-empty list of trigger events (e.g. {type:\"NewRecord\"}, {type:\"UpdateField\", expression},\
        \ {type:\"Signal\"}, {type:\"Scheduled\", schedulerId}). Each route row: if its rule matches,\
        \ route the record via that distribution and run its actions. ruleId is required on every row;\
        \ an always-match route is the catchAll (used when no row matches). routes may be empty (then\
        \ only the catchAll applies). No meeting type anywhere — Distro routes leads, it does not book\
        \ meetings. trigger.evaluation (opt) is a ruleId used as the router's entry rule (records that\
        \ fail it are not routed); trigger.delay (opt) delays evaluation — {type:\"AfterRecordEval\"|\"\
        BeforeRecordEval\", duration}.\n\n  The distribution picks WHO gets the record; actions decide\
        \ WHAT happens to the chosen assignee. Distro requires at least one action per route AND on the\
        \ catch-all — an actionless route fails to publish. ReassignRecord (and UpdateOwnership, with\
        \ optional working-hours / notification / Id-vs-Email match controls) assign the record's owner\
        \ to the distributed user; UpdateField sets a CRM field to a static value (objectType defaults\
        \ to the trigger object, omit value to clear it); UpdateFieldDynamic sets a field to a value resolved\
        \ at routing time — a relative date ({type:\"RelativeDate\", unit, offset}), {!variable.Field}\
        \ template text, or a variable-field reference; SendSlackToAssignee / SendEmailReminderToAssignee\
        \ notify the chosen assignee.\n\n  routingSteps (opt, default empty) run before the rows: Enrichment\
        \ writes data-waterfall output to CRM fields (its variableId / waterfallId reference the router's\
        \ variables & configured waterfalls — passed through, not validated here); SpamCheck scores the\
        \ record and, when Enabled, writes the score to scoreField plus any otherFields. Supply a step\
        \ id to keep it stable; omit it to mint a fresh one.\n\n→\n\n    {id, workspaceId, name?, description?,\
        \ status, routing: {known, representable, rows: [{ruleId?, outcome}], catchAll?: outcome, routingSteps:\
        \ [routingStep]}}\n\n  Note: the created router's status is Inactive — it does NOT route records\
        \ until you call distro-router-activate. The returned routing is the per-row summary (same shape\
        \ as distro-router-get) — representable rows echo back the distribution + actions, and routingSteps\
        \ echo back, not necessarily the exact matrix object you sent\n\n⚠ create is all-or-nothing: if\
        \ any step (configure or publish — e.g. an invalid routing matrix) fails, the partially-created\
        \ router is rolled back (force-deleted) and a typed 422 error is returned — nothing is left behind,\
        \ so resolve the cause and retry\n\nsee: distro-router-activate (make the new router live), workspace-list\
        \ (find a workspaceId), rule-list (find ruleIds), distribution-list (find distributionIds), distro-router-update\
        \ (replace config afterwards)"
      operationId: distroRouterCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistroRouterCreate'
        required: true
      responses:
