components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      description: 'API key in Authorization header. Format: ''Authorization: Bearer <api-key>'' — the
        word ''Bearer'' followed by a space and the key is required. Sending the key without the Bearer
        prefix returns 401.'
      name: Authorization
      in: header
  schemas:
    DistroEnrichmentFieldMapping:
      title: DistroEnrichmentFieldMapping
      type: object
      required:
      - variableId
      - field
      - waterfallId
      - overwriteExisting
      properties:
        variableId:
          description: Router variable identifying the target record.
          type: string
        field:
          description: CRM field to write the waterfall result into.
          type: string
        waterfallId:
          description: Enrichment waterfall supplying the value.
          type: string
        overwriteExisting:
          description: Whether to overwrite an existing field value.
          type: boolean
        relation:
          description: Related-object path to traverse before writing.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DistroSimpleObjectType'
    DistroSpamSalesforceWrite_Enabled:
      title: DistroSpamSalesforceWrite_Enabled
      type: object
      required:
      - type
      properties:
        scoreField:
          type: string
        otherFields:
          type: array
          items:
            $ref: '#/components/schemas/DistroSpamFieldUpdate'
        type:
          type: string
          const: Enabled
    DistributionAssignmentTypeConfig:
      title: DistributionAssignmentTypeConfig
      oneOf:
      - $ref: '#/components/schemas/DistributionAssignmentTypeConfig_Conversation'
      - $ref: '#/components/schemas/DistributionAssignmentTypeConfig_Meeting'
      - $ref: '#/components/schemas/DistributionAssignmentTypeConfig_Record'
      discriminator:
        propertyName: type
        mapping:
          Conversation: '#/components/schemas/DistributionAssignmentTypeConfig_Conversation'
          Meeting: '#/components/schemas/DistributionAssignmentTypeConfig_Meeting'
          Record: '#/components/schemas/DistributionAssignmentTypeConfig_Record'
    DistroRoutingStep_SpamCheck:
      title: DistroRoutingStep_SpamCheck
      type: object
      required:
      - salesforceWrite
      - type
      properties:
        id:
          type: string
        salesforceWrite:
          $ref: '#/components/schemas/DistroSpamSalesforceWrite'
        type:
          type: string
          const: SpamCheck
    SingleOperator:
      title: SingleOperator
      type: string
      enum:
      - notEmpty
      - empty
    RuleView:
      title: RuleView
      oneOf:
      - $ref: '#/components/schemas/RuleView_AssignmentTableRule'
      - $ref: '#/components/schemas/RuleView_NonOwnershipRule'
      - $ref: '#/components/schemas/RuleView_OwnershipRule'
      discriminator:
        propertyName: type
        mapping:
          AssignmentTableRule: '#/components/schemas/RuleView_AssignmentTableRule'
          NonOwnershipRule: '#/components/schemas/RuleView_NonOwnershipRule'
          OwnershipRule: '#/components/schemas/RuleView_OwnershipRule'
    DistroRouting:
      title: DistroRouting
      type: object
      required:
      - trigger
      - catchAll
      properties:
        trigger:
          $ref: '#/components/schemas/DistroRoutingTrigger'
        routes:
          description: Conditional route rows, evaluated in order.
          type: array
          items:
            $ref: '#/components/schemas/DistroRouteRow'
        catchAll:
          $ref: '#/components/schemas/DistroCatchAll'
        routingSteps:
          description: Ordered pre-distribution steps; replaces existing steps when supplied.
          type: array
          items:
