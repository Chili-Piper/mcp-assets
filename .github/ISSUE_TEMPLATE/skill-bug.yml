name: Skill bug report
description: A skill or GPT doesn't work, returns wrong data, or throws an error
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: skill
    attributes:
      label: Which skill or GPT?
      placeholder: "e.g. skills/meeting-inspector or gpts/no-show-analyzer"
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Steps to reproduce and the error or wrong output you got
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "e.g. Claude Code 1.x, macOS 15, chili-piper MCP via API key / OAuth"

  - type: checkboxes
    id: data_safety
    attributes:
      label: Data safety confirmation
      options:
        - label: I have not included any real customer data, credentials, or API keys in this issue
          required: true
