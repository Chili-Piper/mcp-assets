name: New recipe proposal
description: Propose a new AI-assisted GTM hack for the cookbook
title: "[Recipe] "
labels: ["recipe-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a recipe! Fill in as much as you can — even a rough outline helps maintainers review faster.

  - type: input
    id: title
    attributes:
      label: Recipe title
      placeholder: "e.g. Score accounts on NRR fit, not just ICP"
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Bowtie stage
      options:
        - awareness
        - education
        - selection
        - onboarding
        - impact
        - expansion
        - orchestration
        - measurement
        - leverage
    validations:
      required: true

  - type: dropdown
    id: persona
    attributes:
      label: Primary persona
      multiple: true
      options:
        - AE
        - SDR
        - CS / CSM
        - RevOps
        - PMM
        - Content
        - Events
        - GTM engineer
        - Demand gen

  - type: textarea
    id: outcome
    attributes:
      label: Business outcome
      description: What does a GTM team get from running this recipe?
      placeholder: "e.g. Prioritized outreach list ranked by expansion potential, refreshed weekly"
    validations:
      required: true

  - type: textarea
    id: human_loop
    attributes:
      label: Human-agent loop
      description: Which humans are involved, what do they do, where do they bring judgment?
      placeholder: |
        Human: AE
        Does: approves final outreach list, writes personal hooks
        Agent does: scores accounts, drafts email bodies, flags anomalies

  - type: textarea
    id: stack
    attributes:
      label: Tool stack
      placeholder: "e.g. claude-code, chili-piper-mcp, salesforce-mcp, clay-mcp"

  - type: textarea
    id: measurement
    attributes:
      label: Measurement loop
      description: What gets written back to Salesforce/HubSpot and how is it optimized?

  - type: dropdown
    id: maturity
    attributes:
      label: Maturity
      options:
        - idea
        - draft
        - tested
        - proven
